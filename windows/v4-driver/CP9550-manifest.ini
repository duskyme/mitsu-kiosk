[DriverConfig]
DataFile=CP9550.gpd
; Core files only (ntprint / ntprint4). Do NOT list Cp9550RenderFilter.dll here.
; IHV filters ship via INF CopyFiles. RequiredFiles lookups against core packages
; for IHV DLLs cause PrintService event 235.
RequiredFiles=UNIRES.DLL,STDNAMES.GPD,STDDTYPE.GDL,STDSCHEM.GDL,STDSCHMX.GDL,MSXPSINC.GPD
PrinterDriverID={A55C9550-06D3-4A55-9D77-C9550D0500A1}
DriverCategory=PrintFax.Printer
Flags=NotShareable

[DriverRender]
PageOutputQuality.Draft=MxdcImageType.JPEGHigh
PageOutputQuality.Normal=MxdcImageType.JPEGMedium
PageOutputQuality.High=MxdcImageType.PNG
; Proprietary planar RGB PDL owned by Cp9550RenderFilter.
OutputFormat=application/octet-stream
; Prefer MSXPS for GDI/MXDC. Keep OpenXPS second for modern apps.
; Filter uses IXpsOMObjectFactory1::CreatePageFromStream1 (OpenXPS-safe).
; OpenXPS-only + classic CreatePageFromStream -> XPS_E_INVALID_MARKUP (0x8052000C).
XpsFormat=XPS,OpenXPS
